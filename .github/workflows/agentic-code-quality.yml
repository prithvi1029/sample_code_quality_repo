name: Agentic Code Quality Monitor

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest radon

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run complexity analysis
        run: |
          radon cc . -s
          radon mi . -s
